<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Plot gallery</title>
  <link rel="stylesheet" href="./gallery.css">
</head>
<body>
  <header>
    <div>
      <h1>Super Plot</h1>
      <p>Statistical charts for people and agents. Every chart below is one JSON spec.</p>
    </div>
    <div class="controls">
      <div class="seg" id="theme" role="group" aria-label="Theme">
        <button data-v="light">Light</button><button data-v="dark">Dark</button><button data-v="auto">Auto</button>
      </div>
      <label class="toggle"><input type="checkbox" id="brand"> Override with CSS variables</label>
    </div>
  </header>
  <main>
    <section id="grid" class="grid"></section>
    <section class="play">
      <h2>Playground</h2>
      <p>Edit the spec. Mistakes come back with a path, a code and a hint, the same text an agent gets.</p>
      <div class="play-grid">
        <textarea id="spec" spellcheck="false" aria-label="Plot spec JSON"></textarea>
        <div>
          <div id="play-plot" class="card"></div>
          <ul id="issues" class="issues" aria-live="polite"></ul>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
