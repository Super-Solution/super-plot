[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-plot"
version = "0.5.0"
description = "Super Plot for Python: validate chart specs, describe them in words, and shared statistics. Drawing stays in the TypeScript packages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "Apache-2.0" }
authors = [{ name = "SUPER SOLUTION LABS INC" }]
# Not published yet: the owner decides when.
classifiers = ["Private :: Do Not Upload"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
super_plot = ["fields.v1.json", "py.typed"]
